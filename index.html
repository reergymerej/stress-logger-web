<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Stress Logger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Stress Logger</h1>

  <p id="loading" role="status" hidden>Loading… The server can take a few seconds to wake up.</p>

  <div id="unreachable" hidden>
    <p class="error">Couldn't reach the server.</p>
    <button id="retry">Try again</button>
  </div>

  <form id="signin" hidden>
    <p id="signin-error" class="error" hidden>Wrong username or password</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button>Sign in</button>
  </form>

  <main id="app" hidden>
    <form id="log">
      <label for="description">What stressed you?</label>
      <input id="description" name="description" autocomplete="off">
      <button>Log</button>
    </form>

    <p id="patterns-error" class="error" hidden>Couldn't load the counts</p>

    <details id="patterns">
      <summary>Patterns</summary>
      <h2>By hour of day</h2>
      <div id="by-hour" class="chart"></div>
      <h2>By day of week</h2>
      <div id="by-day" class="chart"></div>
    </details>

    <ul id="stressors"></ul>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
